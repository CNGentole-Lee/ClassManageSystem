name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pycryptodome
      
      - name: Platform self-check
        run: python tools\windows_check.py
      
      - name: Storage and log checks
        run: |
          python tools\config_check.py
          python tools\config_crypto_check.py
          python tools\log_crypto_check.py
      
      - name: Build EXE
        run: |
          set PYINSTALLER_CONFIG_DIR=%CD%\.pyinstaller-cache
          python -m PyInstaller packaging\windows\ClassManageSystem.spec --noconfirm --clean
      
      - name: Smoke test
        shell: cmd
        run: start /B dist\ClassManageSystem\ClassManageSystem.exe && timeout /T 12 /NOBREAK && tasklist | findstr ClassManageSystem && echo "Process alive" && if exist "dist\ClassManageSystem\crash.log" (for %%I in ("dist\ClassManageSystem\crash.log") do if %%~zI neq 0 exit /b 1)
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassManageSystem-windows-x64
          path: dist\ClassManageSystem\
