name: release

# 把 Windows 与 macOS 的构建产物发到 GitHub Release（标签默认 V{版本号}）
#
# 原则：
#   * 两个平台按**同一个提交**取产物，避免 Win 和 Mac 来自不同代码；
#   * **一个平台失败不拖住另一个**：谁成功就先发谁，Release 说明里写清缺哪个；
#   * 两个都失败才整体失败。
#
# 触发：
#   1) build-windows-installer / build-macos-app 成功后自动触发
#      （只接受 push 触发的构建，PR 不会发版）
#   2) 手动：Actions → release → Run workflow（可指定 tag / 提交）

on:
  workflow_run:
    workflows: ["build-windows-installer", "build-macos-app"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（留空则用 V{版本号}，例如 V3.0.1）"
        required: false
        default: ""
      sha:
        description: "要发布的提交 SHA（留空则用默认分支最新提交）"
        required: false
        default: ""

permissions:
  contents: write        # 创建 release / 上传资产
  actions: read          # 跨运行下载 artifact

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and the commit to publish
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(python3 tools/_version.py)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            SHA="${{ inputs.sha }}"
            if [ -z "$SHA" ]; then
              SHA=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.repository.default_branch }}" --jq .sha)
            fi
          else
            TAG=""
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          # 默认用 V{版本号}：标题与 tag 永远一致，latest 自动指向它
          [ -n "$TAG" ] || TAG="V${VER}"
          [ -n "$SHA" ] || { echo "::error::cannot resolve commit"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing commit $SHA to $TAG"

      - name: Wait for both platform builds
        id: runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.meta.outputs.sha }}"

          # 两个工作流独立完成：先完成的会先触发 release。
          # 这里最多等 20 分钟；等不到的那一方就按“缺失”处理，
          # 绝不让一个平台的失败拖住另一个平台的发布。
          latest() {
            gh run list --repo "${{ github.repository }}" --workflow "$1" \
              --commit "$SHA" --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] // {} | "\(.databaseId // "")\t\(.status // "")\t\(.conclusion // "")"'
          }

          win_id=""; win_ok=false
          mac_id=""; mac_ok=false
          for attempt in $(seq 1 40); do
            IFS=$'\t' read -r w_id w_status w_concl < <(latest build-windows.yml) || true
            IFS=$'\t' read -r m_id m_status m_concl < <(latest build-macos.yml) || true

            if [ -n "$w_id" ] && [ "$w_concl" = "success" ]; then win_ok=true; fi
            if [ -n "$m_id" ] && [ "$m_concl" = "success" ]; then mac_ok=true; fi

            win_done=false; mac_done=false
            [ "$w_status" = "completed" ] && win_done=true
            [ "$m_status" = "completed" ] && mac_done=true

            if $win_done && $mac_done; then
              echo "both builds finished on attempt $attempt"
              break
            fi
            echo "attempt $attempt/40: windows='${w_status:-none}/${w_concl:-none}' macos='${m_status:-none}/${m_concl:-none}'"
            sleep 30
          done

          echo "windows_ok=$win_ok" >> "$GITHUB_OUTPUT"
          echo "macos_ok=$mac_ok"   >> "$GITHUB_OUTPUT"
          [ -n "$win_id" ] && echo "windows_run=$win_id" >> "$GITHUB_OUTPUT"
          [ -n "$mac_id" ] && echo "macos_run=$mac_id"   >> "$GITHUB_OUTPUT"
          echo "windows_ok=$win_ok macos_ok=$mac_ok"

          if [ "$win_ok" != "true" ] && [ "$mac_ok" != "true" ]; then
            echo "::error::no successful build for $SHA on either platform"
            exit 1
          fi
          if [ "$win_ok" != "true" ]; then
            echo "::warning::Windows build is missing; publishing macOS only"
          fi
          if [ "$mac_ok" != "true" ]; then
            echo "::warning::macOS build is missing; publishing Windows only"
          fi

      - name: Download available artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/windows artifacts/macos

          if [ "${{ steps.runs.outputs.windows_ok }}" = "true" ]; then
            if gh run download "${{ steps.runs.outputs.windows_run }}" \
                 --repo "${{ github.repository }}" \
                 --name ClassManageSystem-windows-x64 --dir artifacts/windows; then
              echo "windows artifact downloaded"
            else
              echo "::warning::windows artifact download failed (expired?)"
            fi
          fi

          if [ "${{ steps.runs.outputs.macos_ok }}" = "true" ]; then
            if gh run download "${{ steps.runs.outputs.macos_run }}" \
                 --repo "${{ github.repository }}" \
                 --name ClassManageSystem-macos-arm64 --dir artifacts/macos; then
              echo "macos artifact downloaded"
            else
              echo "::warning::macos artifact download failed (expired?)"
            fi
          fi

          find artifacts -maxdepth 3 -type f -printf '  %p (%s bytes)\n' | sort || true

      - name: Verify Windows artifacts
        if: ${{ steps.runs.outputs.windows_ok == 'true' }}
        run: |
          set -euo pipefail
          setup=$(find artifacts/windows -maxdepth 2 -name '*Setup.exe' | head -n1)
          portable=$(find artifacts/windows -maxdepth 2 -name '*portable.zip' | head -n1)
          [ -n "$setup" ] || { echo "::error::Setup.exe not found"; exit 1; }
          [ -n "$portable" ] || { echo "::error::portable.zip not found"; exit 1; }

          mkdir -p check-win
          unzip -q "$portable" -d check-win
          exe=$(find check-win -name ClassManageSystem.exe | head -n1)
          sign=$(find check-win -name cmd_sign.exe | head -n1)
          verify=$(find check-win -name cmd_verify.exe | head -n1)
          [ -n "$exe" ] || { echo "::error::ClassManageSystem.exe missing in portable.zip"; exit 1; }
          [ -n "$sign" ] || { echo "::error::cmd_sign.exe missing in portable.zip"; exit 1; }
          [ -n "$verify" ] || { echo "::error::cmd_verify.exe missing in portable.zip"; exit 1; }

          python - "$sign" "$verify" <<'PY'
          import hashlib, pathlib, re, sys

          pinned = set(re.findall(r"[0-9a-f]{64}",
                                  pathlib.Path("namepicker/native_manifest.py")
                                  .read_text(encoding="utf-8")))
          bad = []
          for path in sys.argv[1:]:
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              if digest not in pinned:
                  bad.append(f"{pathlib.Path(path).name}: hash not in the pinned manifest")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("Windows native binaries match the pinned manifest")
          PY
          echo "Windows portable OK: main exe + both native modules (hash verified)"

      - name: Verify macOS artifacts
        if: ${{ steps.runs.outputs.macos_ok == 'true' }}
        run: |
          set -euo pipefail
          # release 跑在 ubuntu 上，**不能执行** macOS 二进制。
          app=$(find artifacts/macos -maxdepth 2 -name 'ClassManageSystem.app' -type d | head -n1)
          [ -n "$app" ] || { echo "::error::ClassManageSystem.app not found"; exit 1; }

          python3 - "$app" <<'PY'
          import hashlib, pathlib, re, sys

          app = pathlib.Path(sys.argv[1])
          manifest = pathlib.Path("namepicker/native_manifest.py").read_text(encoding="utf-8")
          pinned = set(re.findall(r"[0-9a-f]{64}", manifest))

          bad = []
          for name in ("cmd_sign", "cmd_verify"):
              path = app / "Contents" / "Frameworks" / "native" / name
              if not path.is_file():
                  bad.append(f"{name}: missing in .app")
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest not in pinned:
                  bad.append(f"{name}: bundled hash is not in the pinned manifest")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("macOS native binaries match the pinned manifest")
          PY

          ls "$app/Contents/Resources/native/"*.gz >/dev/null 2>&1 || {
            echo "::error::native backups missing from .app"; exit 1; }

          installer=$(find artifacts/macos -maxdepth 1 -name '*.dmg' | head -n1)
          if [ -z "$installer" ]; then
            installer=$(find artifacts/macos -maxdepth 1 -name '*macos*.zip' | head -n1)
          fi
          [ -n "$installer" ] || { echo "::error::no .dmg or macOS .zip produced"; exit 1; }
          echo "macOS OK: both binaries + backups present; installer: $(basename "$installer")"

      - name: Build checksum notes
        run: |
          set -euo pipefail
          {
            echo "### SHA-256"
            echo '```'
            find artifacts -maxdepth 2 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) \
              -print0 | sort -z | xargs -0 sha256sum || true
            echo '```'
            echo
            echo "提交：\`${{ steps.meta.outputs.sha }}\`"
            echo
            if [ "${{ steps.runs.outputs.windows_ok }}" != "true" ]; then
              echo "> ⚠️ Windows 构建本次未成功，未包含 Windows 安装包。"
            fi
            if [ "${{ steps.runs.outputs.macos_ok }}" != "true" ]; then
              echo "> ⚠️ macOS 构建本次未成功，未包含 macOS 安装包。"
            fi
          } > checksums.md
          cat checksums.md

      - name: Build version.json (update-check manifest)
        run: |
          set -euo pipefail
          python tools/make_version_json.py --out artifacts/version.json \
            --build "$(date -Iseconds)" \
            $(find artifacts -maxdepth 2 -type f \
                \( -name "*Setup.exe" -o -name "*.dmg" -o -name "*macos*.zip" \) | sort)
          cat artifacts/version.json

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' namepicker/about_dialog.py | head -n1)
          TITLE="ClassManageSystem ${VER}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file checksums.md
          else
            gh release create "$TAG" --title "$TITLE" --notes-file checksums.md \
              --target "${{ github.event.repository.default_branch }}"
          fi

          mapfile -t files < <(find artifacts -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name 'version.json' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no files to upload"
            exit 1
          fi

          # 逐个上传并重试：GitHub 的 uploads 端点偶发 404/5xx，
          # 一次性传多个时其中一个失败会让其余也白传。
          failed=""
          for file in "${files[@]}"; do
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                ok=1
                break
              fi
              echo "upload failed (attempt $attempt/3): $file"
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              failed="$failed $file"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::failed to upload:$failed"
            exit 1
          fi

          echo "release $TAG assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
